name: Kiểm thử Firestore Rules (emulator)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          npm i --no-save --silent firebase-tools@13 @firebase/rules-unit-testing@3 firebase@10 >/dev/null 2>&1
          npx firebase emulators:exec --config tools/rulestest/firebase.json --only firestore --project demo-hcns "node tools/rulestest/test.mjs" 2>&1 | grep -E "OK  |FAIL|Error"
