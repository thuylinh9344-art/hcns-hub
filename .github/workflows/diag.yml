name: Chẩn đoán OKR nhân viên (tạm)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LINH_HR }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm i --no-save --silent google-auth-library@9 >/dev/null 2>&1
          node tools/diag/okr.mjs
          rm -f "$RUNNER_TEMP/sa.json"
