<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="logo-mark.png">
<title>Bàn điều hành HCNS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: thanh điều hướng trái (cuộn ngang trên điện thoại) + vùng làm việc; thẻ chỉ dùng cho khối cần tách biệt */
:root{
  --bg:#F5F8F2; --surface:#FFFFFF; --sunken:#ECF3E8; --fg:#15241A; --muted:#5A6B5E; --line:#D7E4D3;
  --accent:#13924A; --accent-fg:#FFFFFF; --accent-soft:#E2F2E3; --brand-2:#F38A2A; --brand-2-soft:#FEF0E1;
  --ok:#2D7A4C; --ok-soft:#DFF1E6; --warn:#A86A12; --warn-soft:#FBEFD9; --bad:#BC3B27; --bad-soft:#FBE3DE; --info:#2E5D9C; --info-soft:#E1EAF7;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D140F; --surface:#142019; --sunken:#1A2820; --fg:#E4EEE6; --muted:#94A69A; --line:#28382D;
  --accent:#5DC07A; --accent-fg:#06200F; --accent-soft:#17351F; --brand-2:#F8A14E; --brand-2-soft:#3A2814;
  --ok:#5CC98B; --ok-soft:#163A26; --warn:#E2AE58; --warn-soft:#3A2D14; --bad:#EE7B66; --bad-soft:#3E1F19; --info:#86AEE6; --info-soft:#1A2A40;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D140F; --surface:#142019; --sunken:#1A2820; --fg:#E4EEE6; --muted:#94A69A; --line:#28382D;
  --accent:#5DC07A; --accent-fg:#06200F; --accent-soft:#17351F; --brand-2:#F8A14E; --brand-2-soft:#3A2814;
  --ok:#5CC98B; --ok-soft:#163A26; --warn:#E2AE58; --warn-soft:#3A2D14; --bad:#EE7B66; --bad-soft:#3E1F19; --info:#86AEE6; --info-soft:#1A2A40;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 14px;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#119549,#67B73F 62%,#F37923 62%,#FB9B35) 1}
.brand img{width:40px;height:40px;flex:none}
.brand .bt{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand b{font-size:16px;letter-spacing:-.01em;white-space:nowrap;color:var(--accent)}
.brand b em{font-style:normal;color:var(--brand-2)}
.brand span{font-size:12px;color:var(--muted)}
.navlist{display:flex;flex-direction:column;gap:2px}
.navlist a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:6px;color:var(--fg);text-decoration:none;font-weight:500}
.navlist a:hover{background:var(--sunken)}
.navlist a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 3px 0 0 var(--brand-2)}
.navlist .cnt{font-family:var(--f-num);font-size:11px;padding:1px 6px;border-radius:10px;background:var(--bad-soft);color:var(--bad)}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px}
main{padding-block:24px 48px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.head h1{margin:0;font-size:22px;letter-spacing:-.015em;text-wrap:balance}
.head p{margin:2px 0 0;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap;color:var(--fg);text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0}
textarea{width:100%;min-height:70px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel h2 small{font-weight:400;color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:3fr 2fr;gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:16px}
.stat{padding:14px 16px;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.stat .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-family:var(--f-num);font-size:24px;font-weight:600;margin-top:2px}
.stat .s{font-size:12px;color:var(--muted)}
.stat.bad .v{color:var(--bad)} .stat.warn .v{color:var(--warn)} .stat.ok .v{color:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--sunken);color:var(--muted)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.grade{font-family:var(--f-num);font-weight:700;width:26px;height:26px;display:inline-grid;place-items:center;border-radius:6px}
.grade.A{background:var(--ok-soft);color:var(--ok)} .grade.B{background:var(--info-soft);color:var(--info)} .grade.C{background:var(--warn-soft);color:var(--warn)} .grade.D{background:var(--bad-soft);color:var(--bad)}
.dl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.dl li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.dl li:last-child{border-bottom:0}
.stripe{width:4px;align-self:stretch;border-radius:2px;background:var(--line)}
.stripe.bad{background:var(--bad)} .stripe.warn{background:var(--warn)} .stripe.ok{background:var(--ok)}
.dl .t{font-weight:500;cursor:pointer;overflow-wrap:anywhere}
.dl .m{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--sunken);border-radius:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.bad{background:var(--bad)} .bar i.warn{background:var(--warn)} .bar i.ok{background:var(--ok)} .bar i.mut{background:var(--muted);opacity:.45}
.load{display:grid;grid-template-columns:140px minmax(0,1fr) 70px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.load .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunken);border-radius:var(--r);padding:10px;min-height:200px;display:flex;flex-direction:column;gap:8px}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.col h3{margin:0 2px 2px;font-size:13px;display:flex;justify-content:space-between;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--muted)}
.card .tt{font-weight:500;overflow-wrap:anywhere}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.card.p-cao{box-shadow:inset 3px 0 0 var(--bad)} .card.p-tb{box-shadow:inset 3px 0 0 var(--warn)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--sunken);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunken)}
tr.open td{background:var(--accent-soft)}
td input{width:90px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:999px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.okr{display:flex;flex-direction:column;gap:10px}
.okr .obj{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.okr .obj b{font-size:15px}
.kr{display:grid;grid-template-columns:minmax(0,1fr) 170px 160px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.kr .vals{display:flex;gap:4px;align-items:center;justify-content:flex-end}
.kr input{width:64px;text-align:right}
.rep{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px 28px;max-width:900px}
.rep h2{margin:0;font-size:18px}
.rep h3{font-size:14px;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
.rep .sub{color:var(--muted);margin:2px 0 0}
.rep ul{margin:0;padding-left:20px}
.rep li{margin:3px 0}
.wr{max-width:980px}
.wr .wr-top h2{font-size:20px}
.wr-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:16px 0 4px}
.wr-sum div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.wr-sum span{display:block;font-size:12px;color:var(--muted)}
.wr-sum b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin:2px 0}
.wr-sum small{display:block;font-size:12px;color:var(--muted)}
.wr-sub{font-weight:600;margin:10px 0 4px}
.wr-g{margin:10px 0 2px}
.wr-src{font-size:12px;color:var(--muted);font-style:italic;margin:6px 0 0}
.wr-t .wr-foot td{background:var(--bg);border-top:2px solid var(--line)}
.wr-note{width:100%;margin-top:10px;font:inherit;font-size:13.5px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;background:var(--bg);color:var(--fg);resize:vertical}
.wr-note:focus{border-style:solid;border-color:var(--accent);outline:none}
.wr-sign{display:flex;justify-content:flex-end;margin-top:28px;text-align:center}
.wr-sign>div:last-child{min-width:240px;display:flex;flex-direction:column;gap:4px;align-items:center}
.wr-sign span{margin-top:48px;font-weight:600}
.wr-by{margin-top:40px;text-align:center;font-weight:600;border:1px dashed var(--line);border-radius:6px;padding:4px 8px;background:var(--bg);color:var(--fg)}
.wr-pv{font-family:"Times New Roman",serif}
.wr-pv h3{color:var(--fg)}
.wb{max-width:900px}
.wb .wd-ticks{list-style:none;margin:0;padding:0}.wb .wd-ticks li{display:flex;gap:8px;align-items:flex-start;margin:3px 0;line-height:1.5}.wb .tk{flex:none;width:18px;height:18px;border-radius:50%;background:#1f8a4c;color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-top:2px}.wb .wd-ticks li.open .tk{background:#c98500}
.wb .wd-lg{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}.wb .wd-lg p{margin:0 0 4px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.wb .wd-lgr{margin:5px 0}.wb .wd-lgr b{display:flex;gap:8px;align-items:center}.wb .wd-lgr em{font-style:normal;font-weight:400;color:var(--muted)}
.wb .wd-chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 0 26px}.wb .wd-chips span{font-size:12px;font-weight:700;color:#17703c;background:#e3f3e9;border:1px solid #b9dfc7;border-radius:10px;padding:1px 8px}
.wk-state{max-width:900px;margin:0 0 12px;padding:9px 14px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.wk-state.ok{background:#e3f3e9;border-color:#b9dfc7;color:#17703c}
.wk-show{position:fixed;inset:0;z-index:60;background:var(--surface);overflow:auto;padding:28px 16px 40px}
.wk-show .wb{margin:0 auto;max-width:1100px;border:0;font-size:17px}
.wk-show .wb-ttl h2{font-size:30px}.wk-show .wb-tiles b{font-size:30px}.wk-show .wb-lbl b{font-size:18px}.wk-show .wb-row{grid-template-columns:250px minmax(0,1fr)}
.wk-x{position:fixed;top:12px;left:16px;z-index:61}
.wk-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3f4f1}
.wb-warn{max-width:900px;margin:0 0 12px;padding:10px 14px;border-radius:8px;background:#fdf1d6;color:#6b4c00;font-size:13px;border:1px solid #f0d58a}
.wb-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:3px solid var(--accent);padding-bottom:12px}
.wb-org{font-size:11.5px;color:var(--muted);line-height:1.5}.wb-org b{color:var(--fg)}
.wb-ttl{text-align:center}.wb-ttl h2{margin:0;font-size:22px;text-transform:uppercase;color:var(--accent);letter-spacing:.02em}.wb-ttl p{margin:2px 0 0;color:var(--muted);font-size:13px}
.wb-by{text-align:right;font-size:11.5px;color:var(--muted)}.wb-by b{color:var(--fg);font-size:14px}.wb-by .wr-by{margin-top:2px;width:150px}
.wb-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.wb-tiles div{border:1px solid var(--line);border-top:3px solid var(--muted);border-radius:8px;padding:8px 10px;background:var(--bg)}
.wb-tiles .ok{border-top-color:#1f8a4c}.wb-tiles .warn{border-top-color:#d99a00}.wb-tiles .bad{border-top-color:#c8372d}
.wb-tiles span,.wb-tiles small{display:block;font-size:11.5px;color:var(--muted)}.wb-tiles b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin:2px 0}
.wb-row{display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px;border-top:1px solid var(--line);padding:12px 0}
.wb-lbl{display:flex;gap:10px;align-items:flex-start}.wb-lbl i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.wb-lbl b{display:block;font-size:14px}.wb-lbl small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
.wb-adv .wb-lbl i{background:#c8372d}
.wb-pill,.wb-st{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid transparent}
.wb-st{padding:3px 8px;cursor:pointer}
.wb-pill.ok,.wb-st.ok{background:#e3f3e9;color:#17703c}.wb-pill.warn,.wb-st.warn{background:#fdf1d6;color:#8a6100}.wb-pill.bad,.wb-st.bad{background:#fbe3e1;color:#a52a21}
.wb-body ul{margin:0;padding-left:18px}.wb-body li{margin:3px 0;line-height:1.5}
.wb-ta{margin-top:0;line-height:1.55}
.wb-hint{font-size:11.5px;color:var(--muted);margin-top:4px}.wb-hint .lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline}
.wb-foot{font-size:11.5px;color:var(--muted);font-style:italic;border-top:1px solid var(--line);padding-top:8px;margin:0}
@media (max-width:700px){.wb-row{grid-template-columns:1fr;gap:8px}.wb-head{flex-wrap:wrap}.wb-ttl{order:-1;width:100%;text-align:left}.wb-by{text-align:left}}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.form label.full{grid-column:1/-1}
.form input,.form select,.form textarea{color:var(--fg);font-size:14px}
.modrow{display:grid;grid-template-columns:minmax(0,1fr) 90px 34px;gap:6px;margin-bottom:6px}
.modrow3{display:grid;grid-template-columns:minmax(0,1fr) 80px 70px 34px;gap:6px;margin-bottom:6px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);padding:0;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(10,20,16,.45)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h b{font-size:16px}
.dlg-b{padding:16px 18px;overflow:auto}
.dlg-f{display:flex;justify-content:space-between;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;font-weight:500;z-index:50;max-width:calc(100vw - 40px)}
.note{font-size:12.5px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:6px;background:var(--warn-soft);color:var(--warn);margin-bottom:14px;font-size:13px}
.mt{margin-top:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
@media (max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat:nth-child(3){border-right:0}.stat:nth-child(-n+3){border-bottom:1px solid var(--line)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  nav.side{position:sticky;z-index:5;height:auto;flex-direction:row;align-items:center;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;gap:12px}
  .brand span,.side-foot{display:none}
  .brand{border:0;padding:0 4px}.brand img{width:30px;height:30px}
  .navlist{flex-direction:row}
  .navlist a{white-space:nowrap}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .kr{grid-template-columns:minmax(0,1fr)}
  .kr .vals{justify-content:flex-start}
  .rep{padding:18px}
}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{border-right:0!important;border-bottom:1px solid var(--line)}.form{grid-template-columns:minmax(0,1fr)}.load{grid-template-columns:100px minmax(0,1fr) 60px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.lf{display:grid;grid-template-columns:130px minmax(0,1.4fr) 120px 110px;gap:8px;align-items:end}
.lf label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.lf input,.lf select{width:100%;color:var(--fg)}
.lf .w2{grid-column:span 2}.lf .w4{grid-column:1/-1}
.mini{font-size:12px;color:var(--muted)}
td.wrap{min-width:260px;max-width:420px;white-space:normal;overflow-wrap:anywhere}
.eff td input{width:52px;text-align:right;padding:4px 6px}
.eff th.base{font-family:var(--f-num);font-weight:500;text-transform:none;letter-spacing:0;color:var(--accent);background:var(--surface)}
.rank{font-family:var(--f-num);font-weight:700;padding:2px 8px;border-radius:5px;background:var(--sunken)}
.rank.D1,.rank.D2{background:var(--bad-soft);color:var(--bad)} .rank.D3{background:var(--warn-soft);color:var(--warn)} .rank.D4{background:var(--info-soft);color:var(--info)} .rank.D5,.rank.D6{background:var(--ok-soft);color:var(--ok)}
.up{color:var(--ok);font-weight:600}.down{color:var(--bad);font-weight:600}
.dist{display:flex;gap:8px;flex-wrap:wrap}
.dist div{border:1px solid var(--line);border-radius:6px;padding:6px 12px;text-align:center;min-width:64px;background:var(--surface)}
.dist b{display:block;font-family:var(--f-num);font-size:18px}
.scatter text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.scatter .lbl{fill:var(--fg);font-size:11.5px;font-weight:500}
.scatter .q{font-size:11px;fill:var(--muted);opacity:.9}
details.ref summary{cursor:pointer;font-weight:600;font-size:13px}
details.ref ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted)}
.shoptbl select{min-width:170px}
.hrt td:first-child{white-space:nowrap}
tr.recalert td{background:var(--bad-soft)} tr.recalert td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
table.recbad tbody td{background:color-mix(in srgb,var(--bad-soft) 55%,var(--surface))}
@media (max-width:860px){.lf{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.lf .w2{grid-column:1/-1}}
</style>

<body>
<div class="app">
  <nav class="side" aria-label="Điều hướng">
    <div class="brand"><img src="logo-mark.png" alt="UPharma"><div class="bt"><b>U<em>P</em>harma · HCNS</b><span>Bàn điều hành phòng</span></div></div>
    <div class="navlist" id="nav"></div>
    <div class="side-foot" id="sideFoot">Đang kết nối dữ liệu…</div>
  </nav>
  <main id="main"><div class="empty">Đang tải dữ liệu phòng HCNS…</div></main>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="hub-runtime.js"></script>
<script>
/* ===================== Hằng số & trạng thái ===================== */
const VIEWS=[['tong-quan','Tổng quan'],['bao-cao-tuan','Báo cáo tuần'],['ca-nhan','Nhật ký cá nhân'],['cong-viec','Công việc'],['kpi','KPI & hiệu suất'],['phan-cong','Phân công & hạng D'],['he-thong','Nhân sự hệ thống'],['nghi-viec','Nghỉ việc theo tỉnh'],['bc-nhan-su','Báo cáo nhân sự'],['tuyen-dung','Hồ sơ tuyển dụng'],['okr','OKR'],['bao-cao','Báo cáo'],['cau-hinh','Nhân sự & danh mục']];
const STATUS=[['todo','Cần làm'],['doing','Đang làm'],['review','Chờ duyệt'],['done','Hoàn thành']];
const PRIO={cao:'Cao',tb:'Trung bình',thap:'Thấp'};
const LOG_ST=['Hoàn thành','Đang thực hiện','Chậm tiến độ','Tạm dừng / Hủy'];
const EFF_KEYS=[['tdNT','Tuyển NT'],['tdCHT','Tuyển CHT'],['tdQLKV','Tuyển QLKV'],['tdVP','Tuyển VP'],['hs1','HS 1'],['hs2','HS 2'],['hs3','HS 3'],['hs4','HS 4'],['hs5','HS 5']];
const STAFF_ST={active:'Đang làm',leave:'Nghỉ thai sản / tạm nghỉ',quit:'Đã nghỉ việc'};
const DEFAULT_CFG={gradeA:95,gradeB:85,gradeC:70,kpiMax:1000,remindDays:3,eff:{nt:.005,vp:.01,tdNT:.02,tdCHT:.03,tdQLKV:.1,tdVP:.03,hs1:.1,hs2:.15,hs3:.2,hs4:.25,hs5:.4},dCut:[.65,.75,.85,.95,1.05]};
const S={staff:[],tasks:[],logs:[],effort:[],okrs:[],shops:[],catalog:[],hsRef:{},config:JSON.parse(JSON.stringify(DEFAULT_CFG)),loaded:new Set(),db:null,dl:null,dbState:'wait',canWrite:true,
  view:'tong-quan',taskMode:'board',f:{owner:'',module:'',status:'',q:''},me:'',month:'',kpiOpen:'',okrQ:'',rep:{type:'tuan',date:''},sf:{area:'',who:'',only:''},draft:null,sys:{},mcp:null,sysBusy:false,sysTab:'hd',sysF:{who:'',short:false},sysAssign:'',hrYear:'',rec:{},recBusy:false,recF:{grp:'',mon:''},recTried:0,chtPlan:{},chtF:{mgr:'',area:'',plan:'',st:'',only:true},chtSeeding:false,who:'',chtMeta:{},nvF:{per:'q'+(Math.floor((+new Date().getMonth())/3)+1),open:''}};

/* ===================== Tiện ích ngày & chuỗi ===================== */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>new Date(s+'T00:00:00');
const TODAY=iso(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const ymOf=s=>s.slice(0,7);
const prevM=m=>{const d=pd(m+'-01');d.setMonth(d.getMonth()-1);return iso(d).slice(0,7)};
const qOf=s=>s.slice(0,4)+'-Q'+(Math.floor((+s.slice(5,7)-1)/3)+1);
const fmtD=s=>s?s.slice(8,10)+'/'+s.slice(5,7):'—';
const fmtDY=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'—';
const fmtM=m=>'T'+(+m.slice(5,7))+'/'+m.slice(0,4);
const fmtQ=q=>'Quý '+['I','II','III','IV'][+q.slice(-1)-1]+'/'+q.slice(0,4);
/* Tuần báo cáo của phòng HCNS: từ thứ 6 tuần này đến hết thứ 5 tuần sau */
function weekRange(s){const d=pd(s);const wd=(d.getDay()+2)%7;const a=addDays(s,-wd);return [a,addDays(a,6)]}
function monthRange(m){const a=m+'-01';const d=pd(a);d.setMonth(d.getMonth()+1);d.setDate(0);return [a,iso(d)]}
function quarterRange(q){const y=+q.slice(0,4),k=+q.slice(-1);return [y+'-'+pad((k-1)*3+1)+'-01',iso(new Date(y,k*3,0))]}
function monthsOfQ(q){const y=q.slice(0,4),k=+q.slice(-1);return [0,1,2].map(i=>y+'-'+pad((k-1)*3+1+i))}
const inR=(s,[a,b])=>!!s&&s>=a&&s<=b;
const r1=n=>Math.round(n*10)/10, r3=n=>Math.round(n*1000)/1000;
const nf=n=>n==null||n===''?'—':Number(n).toLocaleString('vi-VN',{maximumFractionDigits:3});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const rid=()=>Math.random().toString(36).slice(2,10);
S.month=ymOf(TODAY);S.okrQ=qOf(TODAY);S.rep.date=TODAY;
const freshDraft=()=>({d:TODAY,code:'',qty:1,result:'',status:'Hoàn thành',ontime:'Có',base:'',area:'',content:'',note:''});
S.draft=freshDraft();

const staffName=id=>(S.staff.find(x=>x.id===id)||{}).name||'Chưa giao';
const shortName=id=>{const n=staffName(id).trim().split(/\s+/);return n.length>1?n.slice(-2).join(' '):n[0]};
const byOrder=(a,b)=>(a.order??99)-(b.order??99)||String(a.name).localeCompare(b.name,'vi');
const allStaff=()=>[...S.staff].sort(byOrder);
const activeStaff=()=>allStaff().filter(s=>(s.status||'active')==='active');
const allModules=()=>{const set=new Set();S.tasks.forEach(t=>t.module&&set.add(t.module));S.catalog.forEach(c=>c.area&&set.add(c.area));return [...set].sort((a,b)=>a.localeCompare(b,'vi'))};
const catBy=code=>S.catalog.find(c=>c.code===code);
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
async function copyText(txt){try{await navigator.clipboard.writeText(txt);toast('Đã sao chép')}catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Đã sao chép')}catch(_){toast('Không sao chép được, hãy chọn và copy thủ công')}ta.remove()}}

/* ===================== Tính KPI & hiệu suất ===================== */
const logDoc=(m,sid)=>S.logs.find(l=>l.month===m&&l.staffId===sid);
const isDoneLog=e=>(e.status||'Hoàn thành')==='Hoàn thành';
/* Điểm tính theo đúng file báo cáo: dòng 'Đang thực hiện' vẫn được tính, chỉ bỏ dòng hủy; có cột Điểm từ sheet thì lấy cột Điểm */
const isVoidLog=e=>/hủy|huỷ|không thực hiện/i.test(String(e.status||''));
const entPts=e=>isVoidLog(e)?0:(e.pts!=null&&e.pts!==''&&!isNaN(+e.pts)?+e.pts:(+e.base||0)*(+e.qty||0));
function gradeOf(p){const c=S.config;return p>=c.gradeA?'A':p>=c.gradeB?'B':p>=c.gradeC?'C':'D'}
function kpiOf(m,sid){
  const d=logDoc(m,sid);const es=d?.entries||[];const max=+S.config.kpiMax||1000;
  const raw=es.reduce((a,e)=>a+entPts(e),0);const pen=+d?.penalty||0;const val=Math.max(0,Math.min(raw,max)-pen);
  return {has:es.length>0,n:es.length,days:new Set(es.map(e=>e.d)).size,codes:new Set(es.map(e=>e.code).filter(Boolean)).size,raw:r1(raw),pen,val:r1(val),max,pct:r1(val/max*100),
    grade:es.length?gradeOf(val/max*100):'—',over:raw>max,late:es.filter(e=>e.ontime==='Không').length,open:es.filter(e=>!isDoneLog(e)).length,noQty:es.filter(e=>isDoneLog(e)&&e.code&&!(+e.qty)).length,last:es.reduce((a,e)=>e.d>a?e.d:a,'')};
}
function areaPts(m,sid,range){const es=(logDoc(m,sid)?.entries||[]).filter(e=>!range||inR(e.d,range));const o={};es.forEach(e=>{const k=e.area||'Khác';o[k]=(o[k]||0)+entPts(e)});return Object.entries(o).sort((a,b)=>b[1]-a[1])}
const shopsOf=(m,sid,type)=>S.shops.filter(s=>s.type===type&&s.m&&s.m[m]===sid);
const effDoc=(m,sid)=>S.effort.find(x=>x.month===m&&x.staffId===sid);
function rankD(s){let r=1;(S.config.dCut||[]).forEach((t,i)=>{if(s>=t-1e-9)r=i+2});return 'D'+r}
function effOf(m,sid){const e=effDoc(m,sid)||{};const b=S.config.eff;const nt=shopsOf(m,sid,'nt').length,vp=shopsOf(m,sid,'vp').length;
  let sc=nt*b.nt+vp*b.vp;EFF_KEYS.forEach(([k])=>sc+=(+e[k]||0)*(+b[k]||0));sc=r3(sc);return {nt,vp,e,score:sc,rank:rankD(sc),has:sc>0}}
const dNum=d=>+String(d||'').replace(/\D/g,'')||0;
function dCompare(cur,now){const a=dNum(cur),b=dNum(now);if(!a||!b)return '';return b>a?`<span class="up" title="Cao hơn hạng hiện hữu">▲</span>`:b<a?`<span class="down" title="Thấp hơn hạng hiện hữu">▼</span>`:''}

/* ===================== Công việc (task) ===================== */
const isDone=t=>t.status==='done';
const overdue=t=>!isDone(t)&&t.due&&t.due<TODAY;
const dueSoon=t=>!isDone(t)&&t.due&&t.due>=TODAY&&diffDays(TODAY,t.due)<=(+S.config.remindDays||3);
function dueInfo(t){
  if(isDone(t))return t.doneAt&&t.due&&t.doneAt>t.due?{c:'warn',txt:'Xong trễ '+diffDays(t.due,t.doneAt)+' ngày'}:{c:'ok',txt:'Đã xong '+fmtD(t.doneAt)};
  if(!t.due)return {c:'',txt:'Chưa có hạn'};const d=diffDays(TODAY,t.due);
  if(d<0)return {c:'bad',txt:'Quá hạn '+(-d)+' ngày'};if(d===0)return {c:'bad',txt:'Hạn hôm nay'};
  if(d<=(+S.config.remindDays||3))return {c:'warn',txt:'Còn '+d+' ngày'};return {c:'',txt:'Hạn '+fmtD(t.due)};
}
function perfOf(sid,range){const mine=S.tasks.filter(t=>t.owner===sid);const done=mine.filter(t=>isDone(t)&&inR(t.doneAt,range));const onTime=done.filter(t=>!t.due||t.doneAt<=t.due).length;
  return {open:mine.filter(t=>!isDone(t)).length,over:mine.filter(overdue).length,done:done.length,rate:done.length?Math.round(onTime/done.length*100):null}}
function okrProgress(o){const krs=(o.krs||[]).filter(k=>+k.target>0);if(!krs.length)return 0;return Math.round(krs.reduce((a,k)=>a+Math.min((+k.current||0)/(+k.target),1),0)/krs.length*100)}

/* ===================== Ghi dữ liệu ===================== */
const chains={};
function write(path,body,mode='set'){
  if(!S.db){toast('Chưa kết nối được kho dữ liệu');return Promise.reject()}
  const run=()=>S.db.doc(path)[mode](body).catch(e=>{
    if(e?.code==='invalid_argument'){S.canWrite=false;render();toast('Bạn chỉ có quyền xem trang này')}
    else if(e?.code==='quota_exceeded')toast('Kho dữ liệu đã đầy, hãy xóa bớt dữ liệu cũ');
    else toast('Lưu chưa thành công, thử lại sau ít giây');throw e});
  chains[path]=(chains[path]||Promise.resolve()).catch(()=>{}).then(run);return chains[path];
}
const del=path=>S.db?S.db.doc(path).delete().catch(()=>toast('Xóa chưa thành công')):null;
const newId=col=>S.db.collection(col).doc().id;
const clean=o=>{const b=JSON.parse(JSON.stringify(o));delete b.id;return b};
function saveLog(m,sid,mut){const old=logDoc(m,sid);const body=old?clean(old):{month:m,staffId:sid,entries:[],penalty:0,penaltyNote:''};mut(body);body.updatedAt=new Date().toISOString();return write('logs/'+m+'_'+sid,body)}
const saveShops=list=>write('assign/shops',{list,updatedAt:new Date().toISOString()});

/* ===================== Khởi động ===================== */
const COLS=['staff','tasks','logs','effort','okrs'];
async function init(){
  readHash();render();
  const db=window.claude?.use?await window.claude.use('db'):null;
  if(!db){S.dbState='none';render();return}
  S.db=db;S.dbState='ok';
  COLS.forEach(c=>db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded.add(c);render()},()=>{S.dbState='err';render()}));
  db.doc('config/main').onSnapshot(s=>{const d=s.exists?s.data():{};S.config={...DEFAULT_CFG,...d,eff:{...DEFAULT_CFG.eff,...(d.eff||{})},dCut:d.dCut||DEFAULT_CFG.dCut};render();if(!(d.effVer>=3))setTimeout(()=>rkMigrate(d),2500);else if(!(d.areasVer>=2))setTimeout(()=>rkAreaMig(d),3500)},()=>{});
  db.doc('catalog/kpi').onSnapshot(s=>{S.catalog=s.exists?(s.data().items||[]):[];render()},()=>{});
  db.doc('catalog/hs').onSnapshot(s=>{S.hsRef=s.exists?(s.data().tiers||{}):{};render()},()=>{});
  db.doc('assign/shops').onSnapshot(s=>{S.shops=s.exists?(s.data().list||[]):[];render()},()=>{});
  db.doc('sys/dsns').onSnapshot(s=>{S.sys=s.exists?s.data():{};_sysCache=null;render()},()=>{});
  db.doc('rec/cv').onSnapshot(s=>{S.rec=s.exists?s.data():{};_recCache=null;render()},()=>{});
  db.doc('cht/meta').onSnapshot(s=>{S.chtMeta=s.exists?s.data():{};render()},()=>{});
  db.collection('chtplan').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});S.chtPlan=o;render();setTimeout(chtMigrate,800)},()=>{});
  window.claude.use('mcp').then(m=>{S.mcp=m;render()}).catch(()=>{});
  const user=await window.claude.use('user');if(user){const c=await user.can('data.write');if(c===false){S.canWrite=false;render()}try{const me=user.me?await user.me():null;S.who=(me&&(me.name||me.email))||''}catch(_){}}
  S.dl=await window.claude.use('downloads');render();
}
function readHash(){const h=location.hash.replace('#','');if(VIEWS.some(v=>v[0]===h))S.view=h}
window.addEventListener('hashchange',()=>{readHash();render()});

/* ===================== Khung render ===================== */
function render(){
  const ae=document.activeElement;const fid=ae&&ae.id&&!$('#dlg').contains(ae)?ae.id:null;let sel=null;try{sel=fid?[ae.selectionStart,ae.selectionEnd]:null}catch(_){}
  const over=S.tasks.filter(overdue).length;
  $('#nav').innerHTML=VIEWS.map(([k,l])=>`<a href="#${k}" ${S.view===k?'aria-current="page"':''}>${l}${k==='cong-viec'&&over?`<span class="cnt">${over}</span>`:''}${k==='tuyen-dung'&&recStaleN()?`<span class="cnt">${recStaleN()}</span>`:''}${k==='nghi-viec'&&nvRedN()?`<span class="cnt">${nvRedN()}</span>`:''}${k==='cht'&&chtLateN()?`<span class="cnt">${chtLateN()}</span>`:''}</a>`).join('');
  $('#sideFoot').textContent=S.dbState==='ok'?(S.canWrite?'Dữ liệu dùng chung, cập nhật trực tiếp':'Chế độ chỉ xem'):S.dbState==='wait'?'Đang kết nối dữ liệu…':'Chưa kết nối được dữ liệu';
  const m=$('#main');
  if(S.dbState==='none'||S.dbState==='err'){m.innerHTML=window.HUB_STANDALONE?`<div class="empty">Tài khoản ${esc(window.HUB_USER_EMAIL||'')} chưa đọc được dữ liệu Bàn điều hành${window.HUB_LAST_ERROR&&window.HUB_LAST_ERROR.code?' (mã lỗi: '+esc(window.HUB_LAST_ERROR.code)+')':''}. Nếu mã lỗi là permission-denied: kiểm tra email này đã có trong Firestore Rules và rules đã Publish, đợi 1 phút rồi tải lại trang.</div>`:`<div class="empty">Trang chưa kết nối được kho dữ liệu dùng chung. Hãy mở trang khi đã đăng nhập claude.ai, rồi tải lại.</div>`;return}
  if(S.loaded.size<COLS.length){m.innerHTML=`<div class="empty">Đang tải dữ liệu phòng HCNS…</div>`;return}
  const fn={'tong-quan':vOverview,'ca-nhan':vMe,'cong-viec':vTasks,'kpi':vKpi,'phan-cong':vAssign,'he-thong':vSys,'cht':vCht,'nghi-viec':vNv,'bc-nhan-su':vHr,'tuyen-dung':vRec,'okr':vOkr,'bao-cao':vReport,'bao-cao-tuan':vWeekly,'cau-hinh':vConfig}[S.view];
  m.innerHTML=(S.canWrite?'':`<div class="banner">Bạn đang ở chế độ chỉ xem. Chủ trang có thể nâng quyền lên Contributor để bạn cập nhật.</div>`)+fn();
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{sel&&el.setSelectionRange(sel[0],sel[1])}catch(_){}}}
}
function head(title,sub,tools=''){return `<div class="head"><div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div><div class="tools">${tools}</div></div>`}
const monthPicker=()=>`<input type="month" id="gMonth" value="${S.month}" aria-label="Chọn tháng">`;
const gradePill=k=>k.has?`<span class="grade ${k.grade}">${k.grade}</span>`:'<span class="pill">Chưa có</span>';
const rankPill=r=>`<span class="rank ${r}">${r}</span>`;

/* ===================== Tổng quan ===================== */
function vOverview(){
  const T=S.tasks,open=T.filter(t=>!isDone(t)),ov=T.filter(overdue),soon=T.filter(dueSoon);const m=ymOf(TODAY);const st=activeStaff();
  const ks=st.map(s=>({s,k:kpiOf(m,s.id),e:effOf(m,s.id)}));const withK=ks.filter(x=>x.k.has);
  const kAvg=withK.length?Math.round(withK.reduce((a,x)=>a+x.k.val,0)/withK.length):null;
  const loggedToday=ks.filter(x=>(logDoc(m,x.s.id)?.entries||[]).some(e=>e.d===TODAY)).length;
  const q=qOf(TODAY);const okrs=S.okrs.filter(o=>o.quarter===q);const oAvg=okrs.length?Math.round(okrs.reduce((a,o)=>a+okrProgress(o),0)/okrs.length):null;
  const attention=[...ov.sort((a,b)=>a.due.localeCompare(b.due)),...soon.sort((a,b)=>a.due.localeCompare(b.due))];
  const max=+S.config.kpiMax||1000;
  return head('Tổng quan phòng HCNS','Hôm nay '+fmtDY(TODAY)+' · nhắc trước hạn '+S.config.remindDays+' ngày',`<button class="btn" data-act="copy-remind">Sao chép tin nhắc deadline</button><button class="btn pri" data-act="new-task">+ Thêm việc</button>`)+
  `<div class="stats">
    <div class="stat"><div class="k">Việc đang mở</div><div class="v">${open.length}</div><div class="s">${T.filter(t=>t.status==='review').length} chờ duyệt</div></div>
    <div class="stat ${ov.length?'bad':''}"><div class="k">Quá hạn</div><div class="v">${ov.length}</div><div class="s">cần xử lý ngay</div></div>
    <div class="stat ${soon.length?'warn':''}"><div class="k">Sắp đến hạn</div><div class="v">${soon.length}</div><div class="s">trong ${S.config.remindDays} ngày tới</div></div>
    <div class="stat"><div class="k">KPI TB ${fmtM(m)}</div><div class="v">${kAvg==null?'—':nf(kAvg)}</div><div class="s">/ ${nf(max)} điểm · ${withK.length}/${st.length} người có nhật ký</div></div>
    <div class="stat ${loggedToday<st.length?'warn':'ok'}"><div class="k">Nhật ký hôm nay</div><div class="v">${loggedToday}/${st.length}</div><div class="s">người đã ghi nhận</div></div>
    <div class="stat"><div class="k">OKR ${fmtQ(q)}</div><div class="v">${oAvg==null?'—':oAvg+'%'}</div><div class="s">${okrs.length} mục tiêu</div></div>
  </div>
  <div class="grid3">
    <div class="panel"><h2>Cần xử lý <small>việc quá hạn và sắp đến hạn</small></h2>${attention.length?`<ul class="dl">${attention.slice(0,12).map(taskLine).join('')}</ul>${attention.length>12?`<p class="note">Còn ${attention.length-12} việc khác ở mục Công việc.</p>`:''}`:`<div class="empty">Không có việc quá hạn hay sắp đến hạn.</div>`}</div>
    <div class="stack">
      <div class="panel"><h2>KPI & hạng D ${fmtM(m)} <a class="btn sm ghost" href="#kpi">Chi tiết</a></h2>
        ${ks.map(({s,k,e})=>`<div class="load" style="grid-template-columns:130px minmax(0,1fr) 54px 40px"><span class="nm" title="${esc(s.name)}">${esc(s.name)}</span><div class="bar"><i class="${k.grade==='A'?'ok':k.grade==='D'?'bad':k.grade==='C'?'warn':''}" style="width:${k.has?Math.min(k.pct,100):0}%"></i></div><span class="num r note">${k.has?nf(k.val):'—'}</span>${e.has?rankPill(e.rank):'<span class="note">—</span>'}</div>`).join('')}
      </div>
      <div class="panel"><h2>OKR ${fmtQ(q)} <a class="btn sm ghost" href="#okr">Chi tiết</a></h2>
        ${okrs.length?okrs.map(o=>{const p=okrProgress(o);return `<div style="margin-bottom:10px"><div class="row" style="justify-content:space-between;font-size:13px"><span>${esc(o.objective)}</span><b class="num">${p}%</b></div><div class="bar"><i class="${p>=70?'ok':p>=40?'':'warn'}" style="width:${p}%"></i></div></div>`}).join(''):`<div class="empty">Chưa có OKR cho quý này.</div>`}
      </div>
    </div>
  </div>`;
}
function taskLine(t){const d=dueInfo(t);return `<li><span class="stripe ${d.c}"></span><div style="min-width:0"><div class="t" data-act="edit-task" data-id="${t.id}">${esc(t.title)}</div><div class="m">${esc(staffName(t.owner))}${t.module?' · '+esc(t.module):''}</div></div><span class="pill ${d.c}">${d.txt}</span></li>`}
function remindText(){const list=S.tasks.filter(t=>overdue(t)||dueSoon(t));if(!list.length)return 'Hiện không có việc quá hạn hoặc sắp đến hạn.';
  const by={};list.forEach(t=>(by[t.owner||'']??=[]).push(t));
  return `NHẮC DEADLINE PHÒNG HCNS – ${fmtDY(TODAY)}\n`+Object.entries(by).map(([o,ts])=>`\n@${staffName(o)}:\n`+ts.sort((a,b)=>a.due.localeCompare(b.due)).map(t=>`- ${t.title} (${dueInfo(t).txt.toLowerCase()}, hạn ${fmtDY(t.due)})`).join('\n')).join('\n')}

/* ===================== Nhật ký cá nhân ===================== */
function catOptions(sel){const groups={};S.catalog.forEach(c=>(groups[c.area||'Khác']??=[]).push(c));
  return `<option value="">— Việc ngoài danh mục (tự nhập) —</option>`+Object.entries(groups).map(([g,cs])=>`<optgroup label="${esc(g)}">${cs.map(c=>`<option value="${esc(c.code)}" ${c.code===sel?'selected':''}>${esc(c.code)} · ${esc(c.content)} (${nf(c.base)}/${esc(c.unit)})</option>`).join('')}</optgroup>`).join('')}
function vMe(){
  const st=allStaff().filter(s=>(s.status||'active')!=='quit');if(!st.length)return head('Nhật ký cá nhân')+`<div class="empty">Chưa có nhân sự. Thêm ở mục Nhân sự & danh mục.</div>`;

  const s=st.find(x=>x.id===S.me),m=S.month,k=kpiOf(m,s.id),e=effOf(m,s.id),dr=S.draft,dis=S.canWrite?'':'disabled';

  const unit=dr.code?(catBy(dr.code)?.unit||''):'';
  return head('Nhật ký công việc cá nhân',`${esc(s.name)}${s.code?' · '+esc(s.code):''}${s.title?' · '+esc(s.title):''} · kỳ ${fmtM(m)} · đồng bộ từ sheet Báo cáo công việc${S.logAt?' lúc '+S.logAt.slice(11,16):''}`,monthPicker()+lgBtn()+(S.dl?`<button class="btn" data-act="csv-log">Xuất CSV</button>`:''))+
  `<div class="chips">${st.map(x=>`<button class="chip" data-act="me" data-id="${x.id}" aria-pressed="${x.id===s.id}">${esc(x.name)}${(x.status||'active')!=='active'?' (nghỉ)':''}</button>`).join('')}</div>
  <div class="stats">
    <div class="stat"><div class="k">KPI tháng</div><div class="v">${k.has?nf(k.val):'—'}</div><div class="s">/ ${nf(k.max)} · ${k.has?'loại '+k.grade:'chưa có nhật ký'}</div></div>
    <div class="stat ${k.over?'ok':''}"><div class="k">Điểm thực đạt</div><div class="v">${nf(k.raw)}</div><div class="s">${k.over?'vượt trần, tính tối đa '+nf(k.max):k.pen?'trừ lỗi '+nf(k.pen):'trước trần 1.000'}</div></div>
    <div class="stat"><div class="k">Ngày báo cáo</div><div class="v">${k.days}</div><div class="s">${k.n} dòng · ${k.codes} mã việc</div></div>
    <div class="stat ${k.noQty?'warn':''}"><div class="k">Cần bổ sung</div><div class="v">${k.noQty}</div><div class="s">dòng xong chưa nhập SL</div></div>
    <div class="stat"><div class="k">Hiệu suất</div><div class="v">${e.has?nf(e.score):'—'}</div><div class="s">${e.has?'hạng '+e.rank+(s.dCurrent?' · hiện hữu '+esc(s.dCurrent):''):'chưa có phân công'}</div></div>
    <div class="stat"><div class="k">Phụ trách</div><div class="v">${e.nt}</div><div class="s">nhà thuốc${e.vp?' · '+e.vp+' văn phòng':''}</div></div>
  </div>
  <div class="grid3">
    <div class="stack">
      <form class="panel" id="logForm"><h2>Ghi nhận công việc <small>điểm = điểm cơ sở × SL khi Hoàn thành</small></h2>
        <div class="lf">
          <label>Ngày<input type="date" id="lf-d" data-dr="d" value="${esc(dr.d)}" ${dis}></label>
          <label class="w2">Mã việc<select id="lf-code" data-dr="code" ${dis}>${catOptions(dr.code)}</select></label>
          <label>SL ${unit?'('+esc(unit)+')':''}<input type="number" step="any" id="lf-qty" data-dr="qty" value="${esc(dr.qty)}" ${dis}></label>
          <label class="w2">Kết quả / sản phẩm<input id="lf-result" data-dr="result" value="${esc(dr.result)}" placeholder="VD: Hướng dẫn 2 NVBH nhận việc nhà 170" ${dis}></label>
          <label>Trạng thái<select id="lf-status" data-dr="status" ${dis}>${LOG_ST.map(x=>`<option ${dr.status===x?'selected':''}>${x}</option>`).join('')}</select></label>
          <label>Đúng hạn<select id="lf-ontime" data-dr="ontime" ${dis}><option ${dr.ontime==='Có'?'selected':''}>Có</option><option ${dr.ontime==='Không'?'selected':''}>Không</option></select></label>
          ${dr.code?'':`<label>Mảng<input id="lf-area" data-dr="area" list="areaList" value="${esc(dr.area)}" ${dis}></label><label class="w2">Nội dung<input id="lf-content" data-dr="content" value="${esc(dr.content)}" ${dis}></label>`}
          <label>Điểm cơ sở<input type="number" step="any" id="lf-base" data-dr="base" value="${esc(dr.base)}" ${dr.code?'':'placeholder="tự nhập"'} ${dis}></label>
          <label class="${dr.code?'w2':''}">Ghi chú<input id="lf-note" data-dr="note" value="${esc(dr.note)}" ${dis}></label>
          <div style="display:flex;align-items:end"><button class="btn pri" type="submit" data-act="add-log" ${dis} style="width:100%">Thêm · ${nf(((dr.status==='Hoàn thành')?(+dr.base||0)*(+dr.qty||0):0))}đ</button></div>
        </div>
        <datalist id="areaList">${[...new Set(S.catalog.map(c=>c.area))].map(a=>`<option value="${esc(a)}">`).join('')}</datalist>
      </form>
      <div class="tbl-wrap"><table><thead><tr><th>Ngày</th><th>Mã</th><th>Mảng</th><th>Nội dung · kết quả</th><th class="r">SL</th><th class="r">Cơ sở</th><th class="r">Điểm</th><th>Trạng thái</th></tr></thead><tbody>
        ${es.map(x=>`<tr class="click" data-act="edit-log" data-id="${x.id}"><td class="num">${fmtD(x.d)}</td><td class="num">${esc(x.code||'—')}</td><td>${esc(x.area)}</td><td class="wrap">${x.content?`<div class="mini">${esc(x.content)}</div>`:''}${esc(x.result)}${x.note?` <span class="mini">· ${esc(x.note)}</span>`:''}</td><td class="r num">${x.qty==null||x.qty===''?'<span class="pill warn">thiếu</span>':nf(x.qty)}</td><td class="r num">${nf(x.base)}</td><td class="r num"><b>${nf(entPts(x))}</b></td><td>${isDoneLog(x)?`<span class="pill ${x.ontime==='Không'?'warn':'ok'}">${x.ontime==='Không'?'Xong trễ':'Hoàn thành'}</span>`:`<span class="pill info">${esc(x.status)}</span>`}</td></tr>`).join('')||`<tr><td colspan="8" class="note">Chưa có nhật ký trong ${fmtM(m)}. Ghi nhận việc đầu tiên ở khung phía trên.</td></tr>`}

/* ===================== Công việc ===================== */
function filtered(){const f=S.f,q=f.q.trim().toLowerCase();return S.tasks.filter(t=>(!f.owner||t.owner===f.owner)&&(!f.module||t.module===f.module)&&(!f.status||(f.status==='overdue'?overdue(t):t.status===f.status))&&(!q||(t.title+' '+(t.note||'')).toLowerCase().includes(q)))}
function vTasks(){
  const list=filtered();
  const tools=`<div class="seg"><button data-act="mode" data-v="board" aria-pressed="${S.taskMode==='board'}">Bảng</button><button data-act="mode" data-v="list" aria-pressed="${S.taskMode==='list'}">Danh sách</button></div>${S.dl?`<button class="btn" data-act="csv-tasks">Xuất CSV</button>`:''}<button class="btn pri" data-act="new-task">+ Thêm việc</button>`;
  const filters=`<div class="row" style="margin-bottom:14px"><input id="fq" placeholder="Tìm việc…" value="${esc(S.f.q)}" style="width:200px">
    <select id="fowner"><option value="">Tất cả nhân sự</option>${activeStaff().map(s=>`<option value="${s.id}" ${S.f.owner===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
    <select id="fmodule"><option value="">Tất cả mảng</option>${allModules().map(x=>`<option ${S.f.module===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
    <select id="fstatus"><option value="">Mọi trạng thái</option><option value="overdue" ${S.f.status==='overdue'?'selected':''}>Quá hạn</option>${STATUS.map(([k,l])=>`<option value="${k}" ${S.f.status===k?'selected':''}>${l}</option>`).join('')}</select>
    ${S.f.owner||S.f.module||S.f.status||S.f.q?`<button class="btn sm ghost" data-act="clear-f">Bỏ lọc</button>`:''}</div>`;
  let body;
  if(!S.tasks.length)body=`<div class="empty">Chưa có công việc nào. Bấm “+ Thêm việc” để giao việc đầu tiên.</div>`;
  else if(S.taskMode==='board'){const cutoff=addDays(TODAY,-30);
    body=`<div class="board">${STATUS.map(([k,l])=>{let items=list.filter(t=>t.status===k);if(k==='done')items=items.filter(t=>!t.doneAt||t.doneAt>=cutoff);items.sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));
      return `<div class="col" data-col="${k}"><h3>${l}<span class="num">${items.length}</span></h3>${items.map(card).join('')||`<p class="note" style="margin:4px">Kéo thẻ vào đây</p>`}</div>`}).join('')}</div><p class="note">Cột Hoàn thành hiện việc xong trong 30 ngày gần nhất. Kéo thả thẻ để đổi trạng thái, bấm vào thẻ để sửa.</p>`;
  }else{const rows=[...list].sort((a,b)=>(isDone(a)-isDone(b))||(a.due||'9').localeCompare(b.due||'9'));
    body=`<div class="tbl-wrap"><table><thead><tr><th>Công việc</th><th>Phụ trách</th><th>Mảng</th><th>Ưu tiên</th><th>Trạng thái</th><th>Hạn</th><th class="r">Tiến độ</th><th>Tình trạng</th></tr></thead><tbody>${rows.map(t=>{const d=dueInfo(t);return `<tr class="click" data-act="edit-task" data-id="${t.id}"><td style="min-width:220px">${esc(t.title)}</td><td>${esc(staffName(t.owner))}</td><td>${esc(t.module||'')}</td><td>${PRIO[t.priority]||''}</td><td>${(STATUS.find(s=>s[0]===t.status)||[])[1]||''}</td><td class="num">${fmtDY(t.due)}</td><td class="r num">${isDone(t)?100:(+t.progress||0)}%</td><td><span class="pill ${d.c}">${d.txt}</span></td></tr>`}).join('')||`<tr><td colspan="8" class="note">Không có việc khớp bộ lọc.</td></tr>`}</tbody></table></div>`}
  return head('Công việc',`${list.length} việc khớp bộ lọc · ${S.tasks.filter(overdue).length} quá hạn`,tools)+filters+body;
}
function card(t){const d=dueInfo(t);const nx=STATUS.findIndex(s=>s[0]===t.status);
  return `<div class="card p-${t.priority||'tb'}" draggable="${S.canWrite}" data-drag="${t.id}" data-act="edit-task" data-id="${t.id}"><div class="tt">${esc(t.title)}</div>
  <div class="meta"><span>${esc(staffName(t.owner))}</span>${t.module?`<span class="pill">${esc(t.module)}</span>`:''}</div>
  ${!isDone(t)&&+t.progress?`<div class="bar"><i style="width:${+t.progress}%"></i></div>`:''}
  <div class="meta"><span class="pill ${d.c}">${d.txt}</span>${S.canWrite&&nx<3?`<button class="btn sm ghost right" data-act="advance" data-id="${t.id}">→ ${STATUS[nx+1][1]}</button>`:''}</div></div>`}
function setStatus(t,st){const body=clean(t);body.status=st;if(st==='done'){body.doneAt=TODAY;body.progress=100}else body.doneAt=null;write('tasks/'+t.id,body);toast('Đã chuyển sang '+STATUS.find(s=>s[0]===st)[1])}

/* ===================== KPI & hiệu suất ===================== */
function vKpi(){
  const m=S.month;const st=activeStaff();const c=S.config;
  const rows=st.map(s=>({s,k:kpiOf(m,s.id),e:effOf(m,s.id)}));
  return head('KPI & hiệu suất',`KPI 1.000 điểm/người = KPI tuyển dụng + công việc khác theo nhật ký trong quỹ điểm còn lại: A ≥${c.gradeA}%, B ≥${c.gradeB}%, C ≥${c.gradeC}%, dưới đó D · Hiệu suất xếp hạng D1–D6 theo khối lượng phụ trách`,monthPicker()+lgBtn()+(S.dl?`<button class="btn" data-act="csv-kpi">Xuất CSV</button>`:''))+
  `<div class="tbl-wrap"><table><thead><tr><th>Nhân sự</th><th class="r">Ngày BC</th><th class="r">Dòng</th><th class="r">Điểm đạt / phân bổ</th><th class="r">Trừ lỗi</th><th class="r">KPI</th><th>Loại</th><th class="r">Điểm HS</th><th>Hạng D</th><th>D hiện hữu</th></tr></thead><tbody>
  ${rows.map(({s,k,e})=>`<tr class="click ${S.kpiOpen===s.id?'open':''}" data-act="kpi-open" data-id="${s.id}"><td><b>${esc(s.name)}</b><div class="note">${esc(s.title||'')}</div></td><td class="r num">${k.days||'—'}</td><td class="r num">${k.n||'—'}</td><td class="r num">${k.has?nf(k.raw)+(k.alloc?' <span class="mini">/ '+nf(k.plan)+'</span>':''):'—'}${k.over?' <span class="pill ok">vượt trần</span>':''}${k.log&&k.has?' <span class="mini">(nhật ký)</span>':''}</td><td class="r num">${k.pen?'−'+nf(k.pen):''}</td><td class="r num"><b>${k.has?nf(k.val):'—'}</b></td><td>${gradePill(k)}</td><td class="r num">${e.has?nf(e.score):'—'}</td><td>${e.has?rankPill(e.rank)+' '+dCompare(s.dCurrent,e.rank):'—'}</td><td>${s.dCurrent?rankPill(s.dCurrent):'—'}</td></tr>
  ${S.kpiOpen===s.id?`<tr><td colspan="10" style="background:var(--surface)">${kpiDetail(s,m,k)}</td></tr>`:''}`).join('')}
  </tbody></table></div>
  <div class="grid2 mt">
    <div class="panel"><h2>Ma trận KPI × hiệu suất <small>${fmtM(m)}</small></h2>${scatter(rows)}</div>
    <div class="panel"><h2>Xếp hạng KPI ${fmtM(m)}</h2>${rows.filter(r=>r.k.has).sort((a,b)=>b.k.val-a.k.val).map((r,i)=>`<div class="load"><span class="nm"><span class="num note">${i+1}.</span> ${esc(r.s.name)}</span><div class="bar"><i class="${r.k.grade==='A'?'ok':r.k.grade==='D'?'bad':r.k.grade==='C'?'warn':''}" style="width:${Math.min(r.k.pct,100)}%"></i></div><span class="num r">${nf(r.k.val)}</span></div>`).join('')||'<div class="empty">Chưa có nhật ký trong tháng.</div>'}
    <p class="note mt">Bấm vào một dòng ở bảng trên để xem điểm theo mảng và nhập trừ lỗi.</p></div>

function swapDM(s){if(!s)return '';const [Y,M,D]=s.split('-');if(+D>12)return '';return `${Y}-${D}-${M}`}
function hrIssues(y){const R=sysRows(),y0=y+'-01-01',y1=y+'-12-31';const own=r=>r.shop?ownerAt(r.shop,ymOf(TODAY)):'';
  const a=R.filter(r=>r.status==='Nghỉ việc'&&!r.quit).map(r=>({r,d1:r.start,d2:'',hint:'Bổ sung ngày nghỉ việc'}));
  const b=R.filter(r=>r.status==='Nghỉ việc'&&r.quit&&r.start&&r.quit<r.start&&(inR(r.quit,[y0,y1])||inR(r.start,[y0,y1]))).map(r=>{const sw=swapDM(r.quit);return {r,d1:r.start,d2:r.quit,hint:sw&&sw>=r.start&&sw<=TODAY?`Có thể nhập đảo ngày/tháng: đúng có thể là ${fmtDY(sw)}`:'Kiểm tra lại ngày vào làm hoặc ngày nghỉ'}});
  const c=R.filter(r=>r.status==='Thử việc'&&r.probEnd&&r.probEnd<addDays(TODAY,-3)).sort((x,z)=>x.probEnd.localeCompare(z.probEnd)).map(r=>({r,d1:r.start,d2:r.probEnd,hint:`Quá hạn ${diffDays(r.probEnd,TODAY)} ngày: lên chính thức, gia hạn hay đã nghỉ?`}));
  const d=R.filter(r=>sysActive(r)&&!r.start).map(r=>({r,d1:'',d2:'',hint:'Bổ sung ngày bắt đầu thử việc / thực tập'}));
  return [['nv','Ghi "Nghỉ việc" nhưng chưa có ngày nghỉ','Ngày nghỉ',a],['dn','Ngày nghỉ trước ngày vào làm','Ngày nghỉ',b],['tv','Thử việc đã quá ngày kết thúc, chưa cập nhật trạng thái','Kết thúc TV',c],['sd','Đang làm nhưng thiếu ngày bắt đầu','—',d]].filter(g=>g[3].length).map(([k,t,l,items])=>({k,t,l,items,own}))}

function vOkr(){
  const qs=[...new Set([qOf(TODAY),...S.okrs.map(o=>o.quarter)])].sort().reverse();if(!qs.includes(S.okrQ))qs.unshift(S.okrQ);
  const list=S.okrs.filter(o=>o.quarter===S.okrQ).sort((a,b)=>(a.order??99)-(b.order??99));
  const avg=list.length?Math.round(list.reduce((a,o)=>a+okrProgress(o),0)/list.length):0;
  const qr=quarterRange(S.okrQ);const elapsed=Math.max(0,Math.min(100,Math.round(diffDays(qr[0],TODAY)/diffDays(qr[0],qr[1])*100)));
  return head('OKR phòng HCNS',`${fmtQ(S.okrQ)} · tiến độ chung ${avg}% · thời gian quý đã qua ${elapsed}%`,`<select id="okrQ">${qs.map(q=>`<option value="${q}" ${q===S.okrQ?'selected':''}>${fmtQ(q)}</option>`).join('')}</select><button class="btn pri" data-act="new-okr">+ Thêm mục tiêu</button>`)+
  (list.length?`<div class="stack">${list.map(o=>{const p=okrProgress(o);const linked=S.tasks.filter(t=>t.okrId===o.id);const st=p>=elapsed?['ok','Đúng tiến độ']:p>=elapsed-20?['warn','Cần theo dõi']:['bad','Chậm tiến độ'];
    return `<div class="panel okr"><div class="obj"><div style="min-width:0"><b>${esc(o.objective)}</b><div class="note">${esc(o.owner?staffName(o.owner):'Toàn phòng')} · ${linked.length} việc liên kết (${linked.filter(isDone).length} xong)</div></div><div class="row"><span class="pill ${st[0]}">${st[1]}</span><b class="num" style="font-size:18px">${p}%</b><button class="btn sm" data-act="edit-okr" data-id="${o.id}">Sửa</button></div></div>
    <div class="bar"><i class="${st[0]}" style="width:${p}%"></i></div>
    ${(o.krs||[]).map((k,i)=>{const kp=+k.target>0?Math.min(Math.round((+k.current||0)/(+k.target)*100),100):0;return `<div class="kr"><span>${esc(k.title)}</span><div class="bar"><i style="width:${kp}%"></i></div><div class="vals"><input class="num" type="number" step="any" id="kr-${o.id}-${i}" data-kr="${o.id}" data-i="${i}" value="${esc(k.current??0)}" ${S.canWrite?'':'disabled'}><span class="note num">/ ${esc(k.target)} ${esc(k.unit||'')}</span></div></div>`}).join('')}
    </div>`}).join('')}</div>`:`<div class="empty">Chưa có OKR cho ${fmtQ(S.okrQ)}. Bấm “+ Thêm mục tiêu”.</div>`);
}

function repRange(){const {type,date}=S.rep;if(type==='tuan')return weekRange(date);if(type==='thang')return monthRange(ymOf(date));return quarterRange(qOf(date))}
function repTitle(){const {type,date}=S.rep;const r=repRange();if(type==='tuan')return `Báo cáo tuần ${fmtD(r[0])} – ${fmtDY(r[1])}`;if(type==='thang')return 'Báo cáo tháng '+(+date.slice(5,7))+'/'+date.slice(0,4);return 'Báo cáo '+fmtQ(qOf(date)).toLowerCase()}
function buildReport(){
  const r=repRange(),type=S.rep.type,T=S.tasks,staff=activeStaff();
  const done=T.filter(t=>isDone(t)&&inR(t.doneAt,r));const onT=done.filter(t=>!t.due||t.doneAt<=t.due).length;

  const byOwner=(arr,f)=>allStaff().map(s=>{const a=arr.filter(t=>t.owner===s.id);return a.length?{who:s.name,items:a.map(f)}:null}).filter(Boolean).concat((()=>{const a=arr.filter(t=>!S.staff.some(s=>s.id===t.owner));return a.length?[{who:'Chưa giao',items:a.map(f)}]:[]})());

  sec.push({h:'V. Kế hoạch kỳ tới ('+fmtD(nr[0])+' – '+fmtD(nr[1])+')',groups:byOwner(next,t=>`${t.title} – hạn ${fmtD(t.due)}`)});
  if(sysRows().length){const R=sysRows();const yy=r[0].slice(0,4);const hires=R.filter(x=>inR(x.start,r)&&yrOf(x)===yy),quits=R.filter(x=>x.status==='Nghỉ việc'&&inR(x.quit,r)&&yrOf(x)===yy);const early=quits.filter(x=>x.start&&diffDays(x.start,x.quit)<=90);

  if(type!=='tuan'){

function wdBetween(a,b){if(!a||!b)return null;const d=pd(a),e=pd(b);if(e<=d)return 0;let n=0;while(d<e){d.setDate(d.getDate()+1);if(d.getDay()!==0)n++}return n}

function recOwnerMaps(){
  const byCode={},area={},alias={};let mgr='',office='';
  allStaff().forEach(s=>{if(s.code)byCode[String(s.code).trim().toUpperCase()]=s.id;if((s.status||'active')==='quit')return;
    const a=String(s.areas||'');if(/quản lý/i.test(a)&&!mgr)mgr=s.id;if(/khối văn phòng/i.test(a)&&!office)office=s.id;
    a.split(/[,;·]/).map(x=>x.replace(/\(.*?\)/g,'').replace(/tuyển vị trí.*$/i,'').trim()).filter(Boolean).forEach(nm=>{area[normName(nm)]=s.id})});
  Object.entries(REC_ALIAS).forEach(([k,al])=>{const kk=normName(k);if(area[kk])return;for(const x of al){const id=area[normName(x)];if(id){alias[kk]=id;break}}});
  return {byCode,area:{...alias,...area},mgr,office};
}

function chtMgr(code){const p=S.chtPlan[code]||{};if(p.mgrTmp)return p.mgrTmp.trim();const x=shopObj(code);const m=(x&&x.mgr)||CHT_MGRS[CHT_MGR_OF[code]]||(S.chtMeta.mgrs||[])[(S.chtMeta.of||{})[code]]||'';return !m||chtOff().includes(m)?'Chưa có QLKV':m}

function chtAgg(l){const o={nt:l.length,cht:0,ppl:0,no:0,A:0,B:0,tN:0,tE:0,dN:0,dE:0,late:0,doing:0};

const WD_C={blue:'#2a78d6',orange:'#eb6834',aqua:'#1baf7a',gray:'#b9b8b2',ink:'#0b0b0b',ink2:'#52514e',ink3:'#8a8984',grid:'#e6e5e0',ok:'#1f8a4c',warn:'#c98500',bad:'#c8372d'};
const wdT=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-size="${o.fs||11}" fill="${o.c||WD_C.ink2}" text-anchor="${o.a||'start'}"${o.b?' font-weight="700"':''}>${esc(String(s))}</text>`;
/* Tuyển dụng theo người: thanh = đã tuyển, vạch đen = chỉ tiêu riêng */
function wdRecSvg(R){const W=460,rh=26,L=70,Rm=60,H=R.people.length*rh+24;const mx=Math.max(1,...R.people.map(p=>Math.max(p.real,p.tgt)));const sx=v=>L+(W-L-Rm)*v/mx;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Thực tuyển so với chỉ tiêu từng người">`;
  R.people.forEach((p,i)=>{const y=i*rh+6,ok=p.real>=p.tgt;s+=`<g><title>${esc(p.n)}: ${p.real}/${p.tgt} người</title>${wdT(L-8,y+13,p.n,{a:'end',c:WD_C.ink})}<rect x="${L}" y="${y+3}" width="${Math.max(2,sx(p.real)-L)}" height="14" rx="3" fill="${ok?WD_C.blue:'#9cc0ec'}"/><line x1="${sx(p.tgt)}" x2="${sx(p.tgt)}" y1="${y}" y2="${y+20}" stroke="${WD_C.ink}" stroke-width="2"/>${wdT(Math.max(sx(p.real),sx(p.tgt))+6,y+14,`${p.real}/${p.tgt}`,{c:WD_C.ink,b:ok})}</g>`});
  const y=H-8;s+=`<rect x="${L}" y="${y-8}" width="12" height="8" rx="2" fill="${WD_C.blue}"/>${wdT(L+16,y,'đạt chỉ tiêu riêng',{fs:10})}<rect x="${L+120}" y="${y-8}" width="12" height="8" rx="2" fill="#9cc0ec"/>${wdT(L+136,y,'chưa đạt',{fs:10})}<line x1="${L+200}" x2="${L+200}" y1="${y-10}" y2="${y+1}" stroke="${WD_C.ink}" stroke-width="2"/>${wdT(L+206,y,'chỉ tiêu riêng',{fs:10})}`;
  return s+'</svg>'}
/* % hoàn thành KPI cá nhân: thanh ngang, vạch 100% */
function wdKpiSvg(K){const W=460,rh=24,L=70,Rm=56,H=K.length*rh+8;const mx=Math.max(100,...K.map(k=>k.pct));const sx=v=>L+(W-L-Rm)*v/mx;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Phần trăm hoàn thành KPI cá nhân">`;
  K.forEach((k,i)=>{const y=i*rh+4,c=k.pct>=+S.config.gradeB?WD_C.blue:k.pct>=+S.config.gradeC?'#6aa1e3':'#a9c8ef';s+=`<g><title>${esc(k.n)}: ${k.pct}% KPI</title>${wdT(L-8,y+13,k.n,{a:'end',c:WD_C.ink})}<rect x="${L}" y="${y+3}" width="${Math.max(2,sx(k.pct)-L)}" height="14" rx="3" fill="${c}"/>${wdT(sx(k.pct)+6,y+14,k.pct+'%',{c:WD_C.ink,b:true})}</g>`});
  s+=`<line x1="${sx(100)}" x2="${sx(100)}" y1="0" y2="${H-2}" stroke="${WD_C.ink3}" stroke-dasharray="3 3"/>${wdT(sx(100),H,'100%',{a:'middle',fs:9,c:WD_C.ink3})}`;
  return s+'</svg>'}
/* Biến động quân số tháng: đầu tháng → +tuyển mới → −nghỉ việc → hiện hữu */
function wdFlowSvg(F){const W=460,H=250,B=212,T=24;const lo=Math.min(F.start,F.cur)-Math.max(F.hires,F.quits)*1.6,hi=Math.max(F.start+F.hires,F.cur)*1.01;const sy=v=>B-(B-T)*(v-lo)/(hi-lo);
  const cols=[['Đầu tháng',lo,F.start,WD_C.gray,F.start],['Tuyển mới',F.start,F.start+F.hires,WD_C.aqua,'+'+F.hires],['Nghỉ việc',F.start+F.hires-F.quits,F.start+F.hires,WD_C.orange,'−'+F.quits],['Hiện hữu',lo,F.cur,WD_C.blue,F.cur]];
  const bw=70,gap=(W-40-bw*4)/3;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biến động quân số trong tháng"><line x1="20" x2="${W-20}" y1="${B}" y2="${B}" stroke="${WD_C.grid}"/>`;
  cols.forEach(([n,a,b,c,lab],i)=>{const x=20+i*(bw+gap),y1=sy(b),y0=sy(a);s+=`<g><title>${n}: ${lab}</title><rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(2,y0-y1)}" rx="4" fill="${c}"/>${wdT(x+bw/2,y1-6,lab,{a:'middle',c:WD_C.ink,b:true,fs:12})}${wdT(x+bw/2,B+16,n,{a:'middle'})}</g>`;
    if(i<3){const nx=x+bw,ny=sy(i===0?F.start:i===1?F.start+F.hires:F.cur);s+=`<line x1="${nx}" x2="${nx+gap}" y1="${ny}" y2="${ny}" stroke="${WD_C.ink3}" stroke-dasharray="3 3"/>`}});
  return s+'</svg>'}
/* Nghỉ việc tháng: thanh 100% chia nghỉ trước 90 ngày / sau 90 ngày */
function wdQuitSvg(F){const W=460,H=74,L=10,R=W-10,q=Math.max(1,F.quits),e=F.early,x=L+(R-L)*e/q;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cơ cấu nghỉ việc trong tháng"><g><title>Nghỉ trước 90 ngày: ${e}</title><rect x="${L}" y="14" width="${Math.max(2,x-L-1)}" height="22" rx="4" fill="${WD_C.orange}"/></g><g><title>Nghỉ sau 90 ngày: ${F.quits-e}</title><rect x="${x+1}" y="14" width="${Math.max(2,R-x-1)}" height="22" rx="4" fill="${WD_C.gray}"/></g>
  ${wdT(L,58,`Nghỉ trước 90 ngày: ${e} (${Math.round(e/q*100)}%)`,{c:WD_C.ink,b:true})}${wdT(R,58,`Sau 90 ngày: ${F.quits-e}`,{a:'end'})}</svg>`}
/* Thiếu NVBH theo tỉnh */
function wdShortSvg(list){const W=460,rh=22,L=96,H=list.length*rh+8;const mx=Math.max(1,...list.map(x=>x.gap));const sx=v=>(W-L-70)*v/mx;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="NVBH còn thiếu theo tỉnh">`;
  list.forEach((p,i)=>{const y=i*rh+4;s+=`<g><title>${esc(p.a)}: thiếu ${p.gap} NVBH tại ${p.n} nhà</title>${wdT(L-8,y+12,p.a,{a:'end',c:WD_C.ink})}<rect x="${L}" y="${y+2}" width="${Math.max(2,sx(p.gap))}" height="13" rx="3" fill="${WD_C.orange}"/>${wdT(L+sx(p.gap)+6,y+13,`${p.gap} · ${p.n} nhà`)}</g>`});
  return s+'</svg>'}
function wdHero(R){const p=R.tgt?R.real/R.tgt:0,w=Math.min(1,p),st=p>=R.exp?'ok':p>=R.exp*.8?'warn':'bad';
  return `<div class="wd-hero"><div><b>${R.real}<small>/${R.tgt}</small></b><span>người · đạt <strong class="${st}">${Math.round(p*100)}%</strong> chỉ tiêu team · tiến độ thời gian ${Math.round(R.exp*100)}% · trong tuần +${R.w}</span></div><div class="wd-bar"><i class="${st}" style="width:${w*100}%"></i><em style="left:${Math.min(100,R.exp*100)}%"></em></div></div>`}
function wdHtml(d){const B=wbBrief(d),C=wdData(d);const by=wrNote('by')||S.who||'';const lk=wkLock();const sec=k=>B.secs.find(s=>s.k===k);
  const card=(s,extra='')=>`<section class="wd-card"><h3><i>${s.n}</i>${esc(s.h)}${s.sk?` <span class="wb-pill ${wbSt(s)}">${WB_ST[wbSt(s)][0]}</span>`:''}</h3>${extra}<ul>${wbLines(s).map(l=>`<li>${esc(l)}</li>`).join('')}</ul></section>`;
  return `<header class="wd-head"><div class="wd-org">CÔNG TY CỔ PHẦN UPHARMA<br><b>PHÒNG HÀNH CHÍNH – NHÂN SỰ</b></div><div class="wd-ttl"><h1>BÁO CÁO TUẦN ${d.wk}</h1><p>${fmtDY(d.r[0])} – ${fmtDY(d.r[1])} · số liệu đến ${fmtDY(lk?lk.ref:d.ref)}</p></div><div class="wd-by">Người báo cáo<br><b>${esc(by)}</b></div></header>
  <div class="wb-tiles">${B.tiles.map(([k,v,s,c])=>`<div class="${c}"><span>${esc(k)}</span><b>${esc(v)}</b><small>${esc(s)}</small></div>`).join('')}</div>
  <div class="wd-grid">
    ${C.rec?`<section class="wd-card"><h3><i>2</i>Tuyển dụng tháng ${+d.X.m.slice(5,7)}${sec('b2').sk?` <span class="wb-pill ${wbSt(sec('b2'))}">${WB_ST[wbSt(sec('b2'))][0]}</span>`:''}</h3>${wdHero(C.rec)}${C.kpi&&C.kpi.length?`<p class="wd-sub">% hoàn thành KPI cá nhân ${fmtM(d.X.m)}</p>${wdKpiSvg(C.kpi)}`:''}</section>`:''}
    ${C.flow?`<section class="wd-card"><h3><i>1</i>Biến động nhân sự tháng ${+d.X.m.slice(5,7)}${sec('b1').sk?` <span class="wb-pill ${wbSt(sec('b1'))}">${WB_ST[wbSt(sec('b1'))][0]}</span>`:''}</h3>${wdFlowSvg(C.flow)}</section>`:''}
  </div>
  <div class="wd-grid">
    ${card(sec('b1'),'')}
    ${C.short&&C.short.length?`<section class="wd-card"><h3>NVBH còn thiếu theo tỉnh <small>8 tỉnh thiếu nhiều nhất</small></h3>${wdShortSvg(C.short)}</section>`:card(sec('b2'))}
  </div>
  <div class="wd-grid wd-3">${card(sec('b3'))}<section class="wd-card"><h3><i>4</i>${esc(sec('b4').h)}${sec('b4').sk?` <span class="wb-pill ${wbSt(sec('b4'))}">${WB_ST[wbSt(sec('b4'))][0]}</span>`:''}</h3>${wdLegalHtml(wbLines(sec('b4')),C.legal||[])}</section>${card(sec('b5'))}</div>
  ${wrNote('adv')?`<section class="wd-card wd-adv"><h3><i>!</i>Đề xuất – kiến nghị</h3><ul>${wrNote('adv').split('\n').map(x=>x.replace(/^[-•+]\s*/,'').trim()).filter(Boolean).map(l=>`<li>${esc(l)}</li>`).join('')}</ul></section>`:''}
  <footer class="wd-foot">Số liệu: DSNS ${S.sys.updatedAt?fmtDY(S.sys.updatedAt.slice(0,10)):'—'} (gồm học việc sheet TTS) · hồ sơ tuyển dụng ${S.rec.updatedAt?fmtDY(S.rec.updatedAt.slice(0,10)):'—'} · nhật ký công việc phòng HCNS${lk?' · bản đã chốt':''}</footer>`}
/* Hồ sơ pháp lý dạng tick xanh: việc trong tuần + lũy kế tháng theo từng nhà thuốc */
function wdLegalHtml(lines,groups){const items=lines.filter(l=>!/^Lũy kế tháng|^Trong tuần chưa ghi nhận/.test(l));
  const tick=(l,open)=>`<li class="${open?'open':''}"><span class="tk">${open?'◷':'✓'}</span><span>${esc(l)}</span></li>`;
  let h=`<ul class="wd-ticks">${items.length?items.map(l=>/^Không phát sinh/.test(l)?tick('Không phát sinh hồ sơ mới trong tuần',false):tick(l.replace(/\s*–\s*đang thực hiện/,' (đang thực hiện)'),/đang thực hiện/.test(l))).join(''):tick('Trong tuần không phát sinh hồ sơ mới',false)}</ul>`;
  if(groups.length)h+=`<div class="wd-lg"><p>Đã hoàn thành trong tháng</p>${groups.map(g=>`<div class="wd-lgr"><b><span class="tk">✓</span>${esc(g.k)} <em>${g.n} hồ sơ</em></b>${g.nt.length?`<div class="wd-chips">${g.nt.map(n=>`<span>✓ NT ${esc(n)}</span>`).join('')}</div>`:''}</div>`).join('')}</div>`;
  return h}
const WD_TICK_CSS=`.wd-ticks{list-style:none;margin:0;padding:0}.wd-ticks li{display:flex;gap:6px;align-items:flex-start;margin:2px 0;line-height:1.4;font-size:8.8pt}.wd-ticks .tk,.wd-lgr .tk{flex:none;width:14px;height:14px;border-radius:50%;background:#1f8a4c;color:#fff;font-size:8px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}.wd-ticks li.open .tk{background:#c98500}
.wd-lg{margin-top:6px;border-top:1px dashed #d9e2dc;padding-top:5px}.wd-lg p{margin:0 0 3px;font-size:7.5pt;color:#52514e;text-transform:uppercase;letter-spacing:.04em}.wd-lgr{margin:4px 0}.wd-lgr b{display:flex;gap:6px;align-items:center;font-size:8.8pt}.wd-lgr em{font-style:normal;font-weight:400;color:#52514e}
.wd-chips{display:flex;flex-wrap:wrap;gap:3px;margin:3px 0 0 20px}.wd-chips span{font-size:7.5pt;font-weight:700;color:#17703c;background:#e3f3e9;border:1px solid #b9dfc7;border-radius:10px;padding:1px 6px}`;
const WD_CSS=`*{box-sizing:border-box}body{margin:0;background:#f3f4f1;font-family:Arial,Helvetica,sans-serif;color:#0b0b0b;font-size:10.5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;min-height:297mm;margin:12px auto;background:#fff;padding:11mm 11mm 9mm;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.wd-head{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:3px solid #1f8a4c;padding-bottom:7px}
.wd-org,.wd-by{font-size:8pt;color:#52514e;line-height:1.45}.wd-org b,.wd-by b{color:#0b0b0b;font-size:9.5pt}.wd-by{text-align:right}
.wd-ttl{text-align:center}.wd-ttl h1{margin:0;font-size:18pt;color:#1f8a4c;letter-spacing:.02em}.wd-ttl p{margin:2px 0 0;font-size:8.5pt;color:#52514e}
.wb-tiles{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin:8px 0}
.wb-tiles div{border:1px solid #e6e5e0;border-top:3px solid #b9b8b2;border-radius:6px;padding:5px 7px;background:#fcfcfb}
.wb-tiles .ok{border-top-color:#1f8a4c}.wb-tiles .warn{border-top-color:#c98500}.wb-tiles .bad{border-top-color:#c8372d}
.wb-tiles span,.wb-tiles small{display:block;font-size:7.5pt;color:#52514e}.wb-tiles b{display:block;font-size:15pt;margin:1px 0}
.wd-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}.wd-3{grid-template-columns:1fr 1fr 1fr}
.wd-card{border:1px solid #e6e5e0;border-radius:7px;padding:7px 9px;break-inside:avoid;page-break-inside:avoid}
.wd-card h3{margin:0 0 5px;font-size:10pt;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.wd-card h3 small{font-weight:400;color:#8a8984;font-size:8pt}
.wd-card h3 i{font-style:normal;width:17px;height:17px;border-radius:50%;background:#1f8a4c;color:#fff;font-size:8.5pt;display:inline-flex;align-items:center;justify-content:center}
.wd-adv h3 i{background:#c8372d}.wd-adv{margin-bottom:7px}
.wd-card ul{margin:0;padding-left:15px}.wd-card li{margin:1.5px 0;font-size:8.8pt;line-height:1.38}
.wb-pill{font-size:7.5pt;font-weight:700;padding:1px 7px;border-radius:9px}.wb-pill.ok{background:#e3f3e9;color:#17703c}.wb-pill.warn{background:#fdf1d6;color:#7a5600}.wb-pill.bad{background:#fbe3e1;color:#a52a21}
.wd-hero b{font-size:20pt}.wd-hero b small{font-size:11pt;color:#52514e}.wd-hero span{display:block;font-size:8.5pt;color:#52514e;margin:1px 0 4px}.wd-hero strong.ok{color:#17703c}.wd-hero strong.warn{color:#7a5600}.wd-hero strong.bad{color:#a52a21}
.wd-bar{position:relative;height:8px;background:#eeede8;border-radius:4px;margin-bottom:6px}.wd-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:#1f8a4c}.wd-bar i.warn{background:#c98500}.wd-bar i.bad{background:#c8372d}.wd-bar em{position:absolute;top:-3px;width:2px;height:14px;background:#0b0b0b}
svg text{font-family:Arial,Helvetica,sans-serif}
.wd-sub{margin:2px 0 2px;font-size:8.5pt;font-weight:700;color:#52514e}.wd-foot{font-size:7.5pt;color:#8a8984;font-style:italic;border-top:1px solid #e6e5e0;padding-top:4px}
.tool{position:fixed;top:12px;right:16px;display:flex;gap:8px}.tool button{font:600 13px Arial;padding:8px 14px;border-radius:8px;border:1px solid #1f8a4c;background:#1f8a4c;color:#fff;cursor:pointer}
@page{size:A4 portrait;margin:0}
@media print{body{background:#fff}.page{margin:0;box-shadow:none;width:210mm;min-height:auto}.tool{display:none}}
@media screen and (max-width:820px){.page{width:auto;margin:0;padding:14px}.wd-grid,.wd-3{grid-template-columns:1fr}.wb-tiles{grid-template-columns:repeat(2,1fr)}.tool{position:static;justify-content:flex-end;padding:8px}}`;
function wdFile(d){return `<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Báo cáo tuần ${d.wk} – Phòng HCNS</title><style>${WD_CSS}${WD_TICK_CSS}</style></head><body><div class="tool"><button onclick="window.print()">In / Lưu PDF</button></div><div class="page">${wdHtml(d)}</div></body></html>`}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act="wd-html"]');if(!el)return;const d=wrBuild();saveFile(`Bao-cao-tuan-${d.wk}_HCNS_dashboard_${d.r[0]}.html`,wdFile(d))});


/* Báo cáo tuần không hiển thị ô "Nhà thiếu NVBH" và "Việc giao quá hạn" (Linh chốt 30/10/2026) */
const _wbBrief1=wbBrief;wbBrief=function(d){const B=_wbBrief1(d);B.tiles=(B.tiles||[]).filter(x=>!/^Nhà thiếu NVBH|^Việc giao quá hạn/.test(x[0]));return B};
init();
</script>
